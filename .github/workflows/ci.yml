name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which areas a pull request touches decides which slow jobs run; a push to main runs every
  # area that exists. A job skipped by its `if:` counts as passed where it is a required check.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.paths.outputs.android }}
      functions: ${{ steps.paths.outputs.functions }}
      web: ${{ steps.paths.outputs.web }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: paths
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            bash scripts/ci-changes.sh HEAD^1 HEAD >> "$GITHUB_OUTPUT"
          else
            bash scripts/ci-changes.sh "$(git hash-object -t tree /dev/null)" HEAD >> "$GITHUB_OUTPUT"
          fi

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      # Public builds never carry a real Firebase project: the debug APK below is downloadable.
      - name: firebase configuration
        run: bash scripts/firebase-config.sh --placeholder
      - run: bash scripts/android.sh lint
      - run: bash scripts/android.sh test
      - run: bash scripts/android.sh build
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-reports
          path: apps/android/app/build/reports/
          retention-days: 7

  functions:
    needs: changes
    if: needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict --site-dir site

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          mapfile -t files < <({ echo dev; find scripts -name '*.sh' -type f; } | sort)
          shellcheck -x -P SCRIPTDIR "${files[@]}"
      - run: bash scripts/tests/run.sh

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # published checksum of gitleaks_8.30.1_linux_x64.tar.gz
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p bin && tar -xzf "$archive" -C bin gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: secret scan (history)
        run: gitleaks git --no-banner --redact .
      - name: no Firebase config, keystores or keys tracked
        run: |
          if git ls-files | grep -E '(^|/)google-services\.json$|\.(jks|keystore)$|keystore\.properties$|(^|/)\.env$|service-account.*\.json$'; then
            echo "tracked files above must never be committed" >&2; exit 1
          fi
      - name: install foxguard and exiftool
        env:
          FOXGUARD_VERSION: "0.14.1"
          # published checksum of foxguard-linux-x86_64 for v0.14.1
          FOXGUARD_SHA256: 10a531279f7f3e9dcd01996e5e288309cd6d7d2bb2b7fa35de583d0bbe715bc2
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP/bin"
          curl -fsSL -o foxguard "https://github.com/0sec-labs/foxguard/releases/download/v${FOXGUARD_VERSION}/foxguard-linux-x86_64"
          echo "${FOXGUARD_SHA256}  foxguard" | sha256sum -c -
          chmod +x foxguard
          sudo apt-get install -y -qq libimage-exiftool-perl >/dev/null
      - name: security scan (foxguard; reviewed findings carry an inline ignore with the reason)
        run: foxguard .
      - name: personal data (tree, and every commit and file version in this change)
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha }}
        run: |
          args=()
          if [[ -n "$BASE" && "$BASE" != 0000000000000000000000000000000000000000 ]]; then
            args+=(--range "$BASE..$HEAD_SHA")
          fi
          bash scripts/privacy-check.sh "${args[@]}"
