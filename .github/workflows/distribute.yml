name: distribute

# Every push to main that touches the app sends a signed build to the testers
# group in Firebase App Distribution. Off until the DISTRIBUTE variable is "true".
on:
  push:
    branches: [main]
    paths: ["apps/android/**", "eval/**", "VERSION"]
  workflow_dispatch:

concurrency:
  group: distribute
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  testers:
    if: vars.DISTRIBUTE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
      TESTER_GROUPS: ${{ vars.TESTER_GROUPS || 'testers' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: signed build
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          # Like every CI build, tester builds carry no Firebase project.
          bash scripts/firebase-config.sh --placeholder
          bash scripts/android.sh apk release
          rm -f "$ANDROID_KEYSTORE_PATH"
      # keyless when the workload identity provider is configured, else the service-account key
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}
      - run: bash scripts/deploy.sh apk apps/android/app/build/outputs/apk/release/app-release.apk
