name: pages

# Publishes https://nikolareljin.github.io/context-lens/: the web companion at the root and the
# documentation site under /docs/, built into one artifact.
on:
  push:
    branches: [main]
    paths: ["apps/web/**", "apps/android/app/src/main/assets/prompts/**", "docs/**", "docs-overrides/**", "mkdocs.yml", "scripts/site-leak-check.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # The public site is built with no Firebase project; visitors connect their own in the browser.
      - name: web companion
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - name: assemble
        run: |
          mkdir -p site
          cp -R apps/web/dist/. site/
          mkdocs build --strict --site-dir site/docs
          test -f site/index.html && test -f site/docs/index.html && test -f site/googlefb1695ee9a07673e.html
      # The site carries no Firebase project: fail on any key, app id or project host in it.
      # The project id comes from a masked secret, read by this step only (never by the build).
      - name: leak check
        env:
          LEAK_CHECK_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          test -n "$LEAK_CHECK_PROJECT_ID" || { echo "FIREBASE_PROJECT_ID secret is not set" >&2; exit 1; }
          bash scripts/site-leak-check.sh site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
