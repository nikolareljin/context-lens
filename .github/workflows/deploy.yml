name: deploy

# Firestore rules, Cloud Functions and the web dashboard, from main.
# Off until the FIREBASE_DEPLOY variable is "true".
on:
  push:
    branches: [main]
    paths: ["firebase/**", "firebase.json", "functions/**", "apps/web/**", "apps/android/app/src/main/assets/prompts/**"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  firebase:
    if: vars.FIREBASE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: install functions dependencies
        run: |
          if [[ -f functions/package-lock.json ]]; then (cd functions && npm ci --no-audit --no-fund); fi
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}
      - run: bash scripts/deploy.sh all
