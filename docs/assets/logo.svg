<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ContextLens">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="verifyGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- app tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>
  <!-- session context orbit -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="10 10"/>
  <!-- lens ring: on device (cyan) to cloud (violet) -->
  <circle cx="256" cy="256" r="152" fill="none" stroke="url(#lensGrad)" stroke-width="22"/>
  <line x1="366" y1="366" x2="416" y2="416" stroke="url(#lensGrad)" stroke-width="26" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="126" fill="#0B1120" stroke="#1E293B" stroke-width="3"/>
  <!-- local speech -->
  <g stroke="#38BDF8" stroke-width="14" stroke-linecap="round">
    <line x1="176" y1="236" x2="176" y2="276"/>
    <line x1="204" y1="206" x2="204" y2="306"/>
    <line x1="232" y1="224" x2="232" y2="288"/>
  </g>
  <!-- privacy firewall -->
  <line x1="258" y1="188" x2="258" y2="324" stroke="#475569" stroke-width="4" stroke-dasharray="6 6" stroke-linecap="round"/>
  <!-- verified claim -->
  <path d="M282 258 L306 282 L348 226" fill="none" stroke="url(#verifyGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)"/>
  <!-- hybrid spark -->
  <path d="M388 96 C388 118 394 124 416 124 C394 124 388 130 388 152 C388 130 382 124 360 124 C382 124 388 118 388 96 Z" fill="#38BDF8"/>
</svg>
