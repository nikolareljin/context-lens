<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="ContextLens: private, grounded fact checks for real conversations. Local speech stays on the device, Gemini Nano writes one clean question, cloud Gemini with Google Search returns a sourced verdict. Android app, web companion and Chrome extension.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#8B5CF6" stroke-width="1.8" stroke-linecap="round"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="0" y="0" width="1280" height="6" fill="url(#lens)"/>

  <!-- logo and title -->
  <image x="64" y="56" width="176" height="176" xlink:href="logo.svg" href="logo.svg"/>
  <text x="272" y="140" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="76" font-weight="700" fill="#E2E8F0" letter-spacing="-1">ContextLens</text>
  <text x="274" y="190" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="27" fill="#94A3B8">Private, grounded fact checks for real conversations.</text>
  <g font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="17" font-weight="600">
    <rect x="274" y="212" width="124" height="34" rx="17" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.5"/>
    <text x="336" y="235" text-anchor="middle" fill="#7DD3FC">Android</text>
    <rect x="410" y="212" width="196" height="34" rx="17" fill="#6366F1" fill-opacity="0.14" stroke="#6366F1" stroke-opacity="0.6"/>
    <text x="508" y="235" text-anchor="middle" fill="#A5B4FC">Web companion</text>
    <rect x="618" y="212" width="216" height="34" rx="17" fill="#A855F7" fill-opacity="0.14" stroke="#A855F7" stroke-opacity="0.6"/>
    <text x="726" y="235" text-anchor="middle" fill="#D8B4FE">Chrome extension</text>
  </g>

  <!-- three stages -->
  <g font-family="Liberation Sans, Arial, Helvetica, sans-serif">
    <rect x="64" y="300" width="352" height="232" rx="18" fill="#0B1220" stroke="#38BDF8" stroke-opacity="0.75" stroke-width="2"/>
    <text x="90" y="340" font-size="15" font-weight="700" letter-spacing="2.5" fill="#38BDF8">1 · LOCAL SPEECH</text>
    <text x="90" y="384" font-size="23" fill="#E2E8F0">"They raised it again</text>
    <text x="90" y="414" font-size="23" fill="#E2E8F0">here last month."</text>
    <rect x="90" y="436" width="200" height="32" rx="16" fill="#0E2A3D"/>
    <text x="104" y="458" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" fill="#7DD3FC">here → Springfield</text>
    <text x="90" y="506" font-size="16" fill="#94A3B8">stays on the device</text>

    <line x1="420" y1="416" x2="456" y2="416" stroke="#8B5CF6" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="464" y="300" width="352" height="232" rx="18" fill="#0B1220" stroke="#6366F1" stroke-opacity="0.8" stroke-width="2"/>
    <text x="490" y="340" font-size="15" font-weight="700" letter-spacing="2.5" fill="#A5B4FC">2 · CLEAN QUESTION</text>
    <text x="490" y="384" font-size="23" fill="#E2E8F0">Did Springfield raise its</text>
    <text x="490" y="414" font-size="23" fill="#E2E8F0">bus fare in October 2026?</text>
    <rect x="490" y="436" width="252" height="32" rx="16" fill="#1E1B4B"/>
    <text x="504" y="458" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" fill="#C7D2FE">ON_DEVICE · Gemini Nano</text>
    <text x="490" y="506" font-size="16" fill="#94A3B8">no names, numbers or places of yours</text>

    <line x1="820" y1="416" x2="856" y2="416" stroke="#8B5CF6" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="840" y1="286" x2="840" y2="556" stroke="#64748B" stroke-width="2" stroke-dasharray="6 7"/>
    <text x="840" y="276" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2.5" fill="#64748B">PRIVACY FIREWALL</text>

    <rect x="864" y="300" width="352" height="232" rx="18" fill="#0B1220" stroke="#A855F7" stroke-opacity="0.8" stroke-width="2"/>
    <text x="890" y="340" font-size="15" font-weight="700" letter-spacing="2.5" fill="#D8B4FE">3 · GROUNDED FACT CARD</text>
    <rect x="890" y="360" width="128" height="34" rx="17" fill="#10B981"/>
    <path d="M904 377 l8 8 l15 -16" fill="none" stroke="#052e1f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="934" y="383" font-size="15" font-weight="700" fill="#052e1f">VERIFIED</text>
    <text x="890" y="424" font-size="21" fill="#E2E8F0">A neutral verdict, with sources.</text>
    <rect x="890" y="436" width="214" height="32" rx="16" fill="#2E1065"/>
    <text x="904" y="458" font-family="Liberation Mono, DejaVu Sans Mono, monospace" font-size="16" fill="#E9D5FF">IN_CLOUD · grounded</text>
    <text x="890" y="506" font-size="16" fill="#94A3B8">Gemini with Google Search</text>
  </g>

  <text x="64" y="594" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="18" fill="#64748B">Firebase AI Logic hybrid inference · Gemini Nano on device · Grounding with Google Search</text>
</svg>
