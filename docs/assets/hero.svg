<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" role="img" aria-label="ContextLens: local speech stays on the phone, Gemini Nano writes one clean question on the device, cloud Gemini with Google Search returns a sourced verdict">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <style>
      .t { font-family: Roboto, "Helvetica Neue", Arial, sans-serif; fill: #E2E8F0; }
      .h { font-size: 64px; font-weight: 700; letter-spacing: -1px; }
      .s { font-size: 26px; fill: #94A3B8; }
      .k { font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .b { font-size: 22px; }
      .m { font-family: "Roboto Mono", Menlo, monospace; font-size: 17px; }
    </style>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#glow)"/>

  <!-- logo mark -->
  <g transform="translate(96 44) scale(0.52)">
    <circle cx="256" cy="256" r="168" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="10 10"/>
    <circle cx="256" cy="256" r="152" fill="none" stroke="url(#lens)" stroke-width="22"/>
    <line x1="366" y1="366" x2="416" y2="416" stroke="url(#lens)" stroke-width="26" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="126" fill="#0B1120" stroke="#1E293B" stroke-width="3"/>
    <g stroke="#38BDF8" stroke-width="14" stroke-linecap="round">
      <line x1="176" y1="236" x2="176" y2="276"/>
      <line x1="204" y1="206" x2="204" y2="306"/>
      <line x1="232" y1="224" x2="232" y2="288"/>
    </g>
    <line x1="258" y1="188" x2="258" y2="324" stroke="#475569" stroke-width="4" stroke-dasharray="6 6" stroke-linecap="round"/>
    <path d="M282 258 L306 282 L348 226" fill="none" stroke="url(#ok)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
    <path d="M388 96 C388 118 394 124 416 124 C394 124 388 130 388 152 C388 130 382 124 360 124 C382 124 388 118 388 96 Z" fill="#38BDF8"/>
  </g>

  <text class="t h" x="400" y="170">ContextLens</text>
  <text class="t s" x="402" y="216">Private, grounded fact checks for real conversations.</text>

  <!-- stage 1 -->
  <g transform="translate(80 330)">
    <rect width="440" height="230" rx="22" fill="#0B1120" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="2"/>
    <text class="t k" x="28" y="46" fill="#38BDF8" style="fill:#38BDF8">1  LOCAL SPEECH</text>
    <text class="t b" x="28" y="96">"They raised it again</text>
    <text class="t b" x="28" y="128">here last month."</text>
    <rect x="28" y="152" width="266" height="30" rx="15" fill="#38BDF8" fill-opacity="0.14"/>
    <text class="t m" x="44" y="173" style="fill:#7DD3FC">here → Springfield</text>
    <text class="t s" x="28" y="214" style="font-size:17px">stays on the phone</text>
  </g>

  <!-- stage 2 -->
  <g transform="translate(580 330)">
    <rect width="440" height="230" rx="22" fill="#0B1120" stroke="#6366F1" stroke-opacity="0.7" stroke-width="2"/>
    <text class="t k" x="28" y="46" style="fill:#A5B4FC">2  RESOLVED QUESTION</text>
    <text class="t b" x="28" y="96">Did Springfield raise its</text>
    <text class="t b" x="28" y="128">bus fare in October 2026?</text>
    <rect x="28" y="152" width="262" height="30" rx="15" fill="#6366F1" fill-opacity="0.18"/>
    <text class="t m" x="44" y="173" style="fill:#C7D2FE">ON_DEVICE · Gemini Nano</text>
    <text class="t s" x="28" y="214" style="font-size:17px">no names, numbers or places of yours</text>
  </g>

  <!-- privacy firewall between stage 2 and 3 -->
  <line x1="1050" y1="300" x2="1050" y2="590" stroke="#475569" stroke-width="3" stroke-dasharray="8 8"/>
  <text class="t k" x="1050" y="290" text-anchor="middle" style="fill:#64748B;font-size:12px">PRIVACY FIREWALL</text>

  <!-- stage 3 -->
  <g transform="translate(1080 330)">
    <rect width="440" height="230" rx="22" fill="#0B1120" stroke="#A855F7" stroke-opacity="0.7" stroke-width="2"/>
    <text class="t k" x="28" y="46" style="fill:#D8B4FE">3  GROUNDED FACT CARD</text>
    <g transform="translate(28 70)">
      <rect width="140" height="34" rx="17" fill="url(#ok)"/>
      <path d="M18 17 L26 25 L40 9" fill="none" stroke="#052E1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="t" x="50" y="23" style="font-size:15px;font-weight:700;fill:#052E1F">VERIFIED</text>
    </g>
    <text class="t b" x="28" y="136" style="font-size:19px;fill:#CBD5E1">Two neutral sentences, with sources.</text>
    <rect x="28" y="152" width="250" height="30" rx="15" fill="#A855F7" fill-opacity="0.18"/>
    <text class="t m" x="44" y="173" style="fill:#E9D5FF">IN_CLOUD · grounded</text>
    <text class="t s" x="28" y="214" style="font-size:17px">Gemini with Google Search</text>
  </g>

  <!-- connectors -->
  <path d="M520 445 H580" stroke="url(#flow)" stroke-width="4" stroke-linecap="round"/>
  <path d="M1020 445 H1080" stroke="url(#flow)" stroke-width="4" stroke-linecap="round"/>
  <path d="M570 437 L580 445 L570 453" fill="none" stroke="#6366F1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1070 437 L1080 445 L1070 453" fill="none" stroke="#A855F7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="t" x="80" y="612" style="font-size:16px;fill:#64748B">Firebase AI Logic hybrid inference · App Check · Android and Chrome</text>
</svg>
