<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Connect ContextLens</title>
  <link rel="stylesheet" href="connect.css">
</head>
<body>
  <main>
    <h1>Connect ContextLens</h1>
    <p id="status">Reading the link…</p>
    <p><a id="open" class="button" hidden>Open in ContextLens</a></p>
    <p class="small">The values in this link stay on this phone: they are read here, never sent to this site, and ContextLens asks before it uses them.</p>
    <p class="small">No app yet? <a href="https://github.com/nikolareljin/context-lens/releases/latest/download/context-lens.apk">Download the APK</a>, install it, then scan the code again.</p>
  </main>
  <script src="connect.js"></script>
</body>
</html>
